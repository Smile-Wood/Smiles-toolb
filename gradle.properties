# Gradle 自身
# 多版本工程每个节点都要重映射一份 Minecraft，内存给足否则会长时间 GC
# -Dfabric.loom.ci=true 让 Loom 跳过「依赖的 sources 包下载 + 重映射」：
# 这一步会把 Fabric API 的上百个子模块的源码包逐个下载并重映射，纯属无用功。
org.gradle.jvmargs=-Xmx4G -Dfabric.loom.ci=true
# 各节点并行配置会成倍占用内存，串行更稳
org.gradle.parallel=false
# Stonecutter 会在每个版本子工程里重新求值构建脚本，配置缓存收益有限且容易踩坑
org.gradle.configuration-cache=false

# 模组元信息（所有版本共用）
mod.id=smile_toolb
mod.group=smile_toolb
mod.version=1.0.36
mod.name=Smile's toolb
mod.authors=Me!
mod.license=CC0-1.0

# 已知使用 Groovy DSL，关闭 Stonecutter 的提示
dev.kikugie.stonecutter.hard_mode=true
